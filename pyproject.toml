[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "try-project"
version = "2.0.0"
description = "Privacy-Preserving Federated Learning over Noisy AIoT Links with Adaptive Scheduling"
license = {text = "Apache-2.0"}
dependencies = [
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow-cpu>=2.16.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "protobuf>=4.25.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "israelbarnabas"

[tool.flwr.app.components]
serverapp = "try_project.enhanced_server_app:app"
clientapp = "try_project.enhanced_client_app:app"

# ============================================================
# DEFAULT CONFIGURATION - Optimized for learning
# ============================================================
[tool.flwr.app.config]
num-rounds = 30  
local-epochs = 3
batch-size = 32
fraction-train = 1.0
fraction-evaluate = 0.5
non-iid = true
alpha = 0.5
num-clients = 30
window-size = 100
step = 50

use-noisy-channel = true
max-concurrent = 10
simulation-seed = 42
model-size-bytes = 1200000
data-seed = 42

# FIXED: Privacy configuration - HIGHER minimum epsilon
use-adaptive-dp = true
target-epsilon-total = 5.0
epsilon-per-round-max = 1.0
epsilon-per-round-min = 0.7  
target-delta = 0.0001
l2-norm-clip = 0.5

use-adaptive-sa = false
sa-threshold = false

use-fedprox = true
fedprox-mu = 0.15

[tool.flwr.federations]
default = "adaptive-dp-fixed-v2"

# ============================================================
# FIXED V2 - Proper epsilon floor enforcement
# ============================================================
[tool.flwr.federations.adaptive-dp-fixed-v2]
options.num-supernodes = 30
[tool.flwr.federations.adaptive-dp-fixed-v2.config]
use-noisy-channel = true
use-adaptive-dp = true
use-adaptive-sa = false
target-epsilon-total = 5.0
epsilon-per-round-max = 1.0
epsilon-per-round-min = 0.7  
max-concurrent = 10
loss-bad = 0.35
num-rounds = 30  
fedprox-mu = 0.15

# Reliable baseline
[tool.flwr.federations.reliable-baseline]
options.num-supernodes = 30
[tool.flwr.federations.reliable-baseline.config]
use-noisy-channel = false
use-adaptive-dp = false
use-adaptive-sa = false
use-fedprox = false
num-rounds = 30

# Quick test - 10 rounds for debugging
[tool.flwr.federations.quick-test]
options.num-supernodes = 30
[tool.flwr.federations.quick-test.config]
use-noisy-channel = true
use-adaptive-dp = true
use-adaptive-sa = false
target-epsilon-total = 5.0
epsilon-per-round-max = 1.0
epsilon-per-round-min = 0.7
max-concurrent = 10
loss-bad = 0.35
num-rounds = 30
fedprox-mu = 0.15