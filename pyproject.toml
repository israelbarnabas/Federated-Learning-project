[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "try-project"
version = "1.0.0"
description = "Privacy-Preserving Federated Learning over Noisy Links"
license = {text = "Apache-2.0"}  # Fixed
dependencies = [
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow-cpu>=2.16.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "protobuf>=4.25.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "israelbarnabas"

[tool.flwr.app.components]
serverapp = "try_project.server_app:app"
clientapp = "try_project.client_app:app"

# DEFAULT config
[tool.flwr.app.config]
num-rounds = 10
local-epochs = 3
batch-size = 32
fraction-train = 1.0
fraction-evaluate = 0.5
non-iid = true
alpha = 0.5
num-clients = 30
window-size = 100
step = 50
use-noisy-channel = true
p-gb = 0.05
p-bg = 0.95
loss-good = 0.01
loss-bad = 0.35
base-latency-ms = 50.0
simulation-seed = 42
model-size-bytes = 1200000
data-seed = 42

# DP settings
use-dp = true
target-epsilon = 10.0
target-delta = 0.0001
l2-norm-clip = 0.5
noise-multiplier = 0.0
num-microbatches = 1

# FedProx settings
use-fedprox = true
fedprox-mu = 0.05

# Secure Aggregation settings
use-sa = true
sa-threshold = 10

# FEDERATION-SPECIFIC configs
[tool.flwr.federations]
default = "dp-fedprox-heavy"

[tool.flwr.federations.reliable-baseline]
options.num-supernodes = 30

[tool.flwr.federations.reliable-baseline.config]
use-noisy-channel = false
use-dp = false
use-sa = false
use-fedprox = false
num-rounds = 10

[tool.flwr.federations.noisy-light]
options.num-supernodes = 30

[tool.flwr.federations.noisy-light.config]
use-noisy-channel = true
loss-bad = 0.15
num-rounds = 10

[tool.flwr.federations.noisy-medium]
options.num-supernodes = 30

[tool.flwr.federations.noisy-medium.config]
use-noisy-channel = true
loss-bad = 0.25
num-rounds = 10

[tool.flwr.federations.noisy-heavy]
options.num-supernodes = 30

[tool.flwr.federations.noisy-heavy.config]
use-noisy-channel = true
loss-bad = 0.35
num-rounds = 10

[tool.flwr.federations.dp-test]
options.num-supernodes = 30

[tool.flwr.federations.dp-test.config]
use-noisy-channel = true
use-dp = true
target-epsilon = 10.0
l2-norm-clip = 0.5
num-rounds = 10

[tool.flwr.federations.dp-sa-heavy]
options.num-supernodes = 30

[tool.flwr.federations.dp-sa-heavy.config]
use-noisy-channel = true
use-dp = true
use-sa = true
target-epsilon = 10.0
loss-bad = 0.35
l2-norm-clip = 0.5
fedprox-mu = 0.05  
num-rounds = 10

[tool.flwr.federations.fedprox-baseline]
options.num-supernodes = 30

[tool.flwr.federations.fedprox-baseline.config]
use-fedprox = true
fedprox-mu = 0.05
num-rounds = 10

[tool.flwr.federations.dp-fedprox-heavy]
options.num-supernodes = 30

[tool.flwr.federations.dp-fedprox-heavy.config]
use-noisy-channel = true
use-dp = true
use-fedprox = true
loss-bad = 0.35
target-epsilon = 10.0
l2-norm-clip = 0.5
fedprox-mu = 0.05
num-rounds = 10